</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="/">GRUB</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor01">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarColor01">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">

<div class="container mt-4">
    <h2>Add an Item to an Order</h2>

    <div class="form-group">
        <label>Order ID:</label>
        <input id="order-id" class="form-control" placeholder="Enter order ID">
    </div>
    <div class="form-group">
        <label>Your Name:</label>
        <input id="item-user" class="form-control" placeholder="Enter your name">
    </div>
    <div class="form-group">
        <label>Item Name:</label>
        <input id="item-name" class="form-control" placeholder="Enter item">
    </div>
    <div class="form-group">
        <label>Notes (optional):</label>
        <input id="item-notes" class="form-control" placeholder="Any notes">
    </div>

    <button class="btn btn-success mt-2" onclick="addItem()">Add Item</button>
</div>
