<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://themeswitcher.csh.rit.edu/api/get" media="screen">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script defer src="/static/home.js?v=3"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GRUB</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <a class="navbar-brand" href="/">GRUB</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor01">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarColor01">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
                    <a class="nav-link" href="/add_item">Add Item <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://github.com/aln730/GRUB">What is this?</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="https://github.com/aln730/GRUB">
                        <!-- GitHub icon SVG here -->
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Create Order Section -->
        <h2>Create Order</h2>
        <div class="form-group">
            <label>Restaurant:</label>
            <input id="restaurant" class="form-control" placeholder="Enter restaurant">
        </div>
        <div class="form-group">
            <label>Deadline (optional):</label>
            <input id="deadline" class="form-control" type="datetime-local">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input id="password" class="form-control" type="password" placeholder="Choose a password">
        </div>
        <button class="btn btn-primary mt-2" onclick="createOrder()">Create Order</button>
        <p id="create-result" class="mt-2"></p>
        <button id="copy-order-id" class="btn btn-secondary mt-2" style="display:none;" onclick="copyOrderID()">Copy Order ID</button>

        <hr>

        <!-- Fetch Order Section -->
        <h2>Fetch Order</h2>
        <div class="form-group">
            <label>Order ID:</label>
            <input id="order-id" class="form-control" placeholder="Enter order ID">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input id="fetch-password" class="form-control" type="password" placeholder="Enter order password">
        </div>
        <button class="btn btn-primary mt-2" onclick="fetchOrder()">Fetch Order</button>

        <div id="order-data" class="mt-3"></div>
    </div>
</body>
</html>
